# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# src/game/hooks.cpp: mouse look, before the stick's turn rates are added to the player's yaw and pitch
[[hook]]
at = 0xE0AEE
call = "MouseLook"

# the same on a mounted gun
[[hook]]
at = 0xDC911
call = "TurretLook"

# 60 fps: the frame's end waits for 2 vertical blanks (cmp eax, 2 / cmp ecx, 2); src/common/test_hooks.h
[[hook]]
at = 0x13AAF
call = "FrameWaitEax"

[[hook]]
at = 0x13ACA
call = "FrameWaitEcx"

# Elapsed ticks after cvtsi2ss xmm0,eax at every frame-end caller (docs/frame-timing.md).
[[hook]]
at = 0xA2E53
after = true
call = "FrameDelta"

[[hook]]
at = 0xA3567
after = true
call = "FrameDelta"

