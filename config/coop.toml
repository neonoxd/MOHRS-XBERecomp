# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# src/coop/hooks.cpp: mouse look, before the stick's turn rates are added to the player's yaw and pitch
[[hook]]
at = 0xD8A1E
call = "MouseLook"

# 60 fps: the frame's end waits for 2 vertical blanks (cmp eax, 2 / cmp ecx, 2); src/common/test_hooks.h
[[hook]]
at = 0x13AFF
call = "FrameWaitEax"

[[hook]]
at = 0x13B1A
call = "FrameWaitEcx"

# Elapsed ticks after cvtsi2ss xmm0,eax at every frame-end caller (docs/frame-timing.md).
[[hook]]
at = 0x955B3
after = true
call = "FrameDelta"

[[hook]]
at = 0x96795
after = true
call = "FrameDelta"

[[hook]]
at = 0x9683B
after = true
call = "FrameDelta"

[[hook]]
at = 0x9687B
after = true
call = "FrameDelta"

[[hook]]
at = 0x968BB
after = true
call = "FrameDelta"

[[hook]]
at = 0x9755D
after = true
call = "FrameDelta"

[[hook]]
at = 0x9763F
after = true
call = "FrameDelta"

[[hook]]
at = 0x976FD
after = true
call = "FrameDelta"

[[hook]]
at = 0x98E7B
after = true
call = "FrameDelta"

[[hook]]
at = 0x98C88
call = "MissionTicks"

[[hook]]
at = 0x98D94
call = "MenuTicks"

[[hook]]
at = 0xF3684
call = "MessageTicks"

# Loading medal/stars, corresponding to default.xbe's 0xFC9FD / 0xFD3DC.
[[hook]]
at = 0xF550D
call = "ResetLoadingAnimation"

[[hook]]
at = 0xF5EEC
after = true
call = "LoadingAnimation"

# Profile-check/save popup, corresponding to default.xbe's 0xF6B74 / 0xF6C5A.
[[hook]]
at = 0xEF594
call = "ResetPopupAnimation"

[[hook]]
at = 0xEF67A
after = true
call = "PopupAnimation"
